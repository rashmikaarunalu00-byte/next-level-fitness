name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy web files into www/
        run: |
          mkdir -p www
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude 'ios' --exclude 'www' --exclude 'supabase' \
            --exclude '*.md' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'capacitor.config.json' --exclude '.nojekyll' \
            ./ www/
          ls www

      - name: Install Dependencies
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Add iOS platform
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi

      - name: Use app icon
        run: |
          ICON_DIR=$(find ios -type d -name 'AppIcon.appiconset' | head -n 1)
          if [ -n "$ICON_DIR" ] && [ -f www/icon-512.png ]; then
            sips -z 1024 1024 www/icon-512.png --out "$ICON_DIR/AppIcon-512@2x.png" || true
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode & Create Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release clean archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-level-fitness-ipa
          path: ios/App/build/App.ipa
